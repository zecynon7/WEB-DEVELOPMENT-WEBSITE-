<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0806" />
    <title>Café BLK &amp; BRWN | Coffee, food and warm corners</title>
    <meta name="description" content="Café BLK &amp; BRWN: coffee, food and warm corners across Cavite and Alabang. See our menu and prices, find a branch, and reserve a table." />
    <link rel="icon" href="%BASE_URL%logo.jpg" />
    <!-- link previews (chat apps and search engines do not run JavaScript, so these must be static; image URL must be absolute) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Café BLK &amp; BRWN" />
    <meta property="og:title" content="Café BLK &amp; BRWN | Coffee, food and warm corners" />
    <meta property="og:description" content="Coffee, food and warm corners across Cavite and Alabang. See our menu and prices, find a branch, and reserve a table." />
    <meta property="og:url" content="https://jianofreo.github.io/cafe-blk-and-brwn/" />
    <meta property="og:image" content="https://jianofreo.github.io/cafe-blk-and-brwn/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jianofreo.github.io/cafe-blk-and-brwn/og-image.jpg" />
    <script>
      // Marks JS as available, plays the intro only on the first visit of a session, and falls back to a
      // plain page ONLY if the app itself never starts (main.jsx sets window.__bbBooted). Waiting for a
      // sleeping backend must not trigger this, because the loading screen is supposed to stay up for that.
      document.documentElement.classList.add("js");
      var home = "%BASE_URL%";
      try {
        if (location.pathname === home && !sessionStorage.getItem("bb-pre")) document.documentElement.classList.add("is-loading");
      } catch (e) {
        if (location.pathname === home) document.documentElement.classList.add("is-loading");
      }
      setTimeout(function () {
        if (!window.__bbBooted && !document.documentElement.classList.contains("motion-ready")) {
          document.documentElement.classList.add("no-motion");
          document.documentElement.classList.remove("is-loading");
        }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
